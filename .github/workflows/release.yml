name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build -Pversion="${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
